[package]
name = "overview-export-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "overview-export"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
rayon = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
