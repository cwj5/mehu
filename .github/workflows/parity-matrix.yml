name: Parity Gate

on:
  push:
    branches: [main, develop, plot3d-com-file]
  pull_request:
    branches: [main, develop]

jobs:
  parity-governance:
    name: Parity Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate parity matrix governance
        run: npm run validate:parity-matrix

  backend-parity-fixtures:
    name: Backend Parity Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf pkg-config libasound2-dev libssl-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      - name: Run backend parity fixtures
        run: npm run test:parity-backend

  cross-path-parity:
    name: Cross-Path Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run cross-path parity tests
        run: npm run test:parity-cross-path
