name: Parity Matrix Validation

on:
  push:
    branches: [main, develop, plot3d-com-file]
  pull_request:
    branches: [main, develop]

jobs:
  validate-parity-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate parity matrix governance
        run: npm run validate:parity-matrix
